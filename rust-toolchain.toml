# Userspace builds with this stable toolchain. The eBPF crate is built by provd/build.rs with
# the nightly pinned in provd/build.rs (EBPF_TOOLCHAIN; needs rust-src and bpf-linker). Both are
# installed in the VM by scripts/setup-vm.sh.
[toolchain]
channel = "1.100.0"
components = ["clippy", "rustfmt"]
